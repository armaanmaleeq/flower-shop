<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faugel Flower Shop - Always Fresh Flowers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://kit.fontawesome.com/61e8f2680f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        font-family: "Roboto";
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- Header -->
    <header>
      <!-- navbar -->
      <nav
        class="flex items-center justify-between bg-slate-200 shadow-sm px-5"
      >
        <img src="image/logo.png" alt="Faugel" class="h-18 py-2" />
        <div class="flex gap-10">
          <ul class="flex text-lg font-medium gap-8">
            <li
              class="hover:text-[#E95A08] hover:cursor-pointer border-b-slate-200 hover:border-b-[#E95A08] border-b-[3px] transition duration-150 ease-in"
            >
              <a href="#">Home</a>
            </li>
            <li
              class="hover:text-[#E95A08] hover:cursor-pointer border-b-slate-200 hover:border-b-[#E95A08] border-b-[3px] transition duration-150 ease-in"
            >
              <a href="#">Shop</a>
            </li>
            <li
              class="hover:text-[#E95A08] hover:cursor-pointer border-b-slate-200 hover:border-b-[#E95A08] border-b-[3px] transition duration-150 ease-in"
            >
              <a href="#">Blog</a>
            </li>
            <li
              class="hover:text-[#E95A08] hover:cursor-pointer border-b-slate-200 hover:border-b-[#E95A08] border-b-[3px] transition duration-150 ease-in"
            >
              <a href="#">About Us</a>
            </li>
          </ul>
          <div
            class="text-lg font-medium flex items-center justify-center gap-2 hover:cursor-pointer hover:text-[#E95A08] border-b-slate-200 hover:border-b-[#E95A08] border-b-[3px] transition duration-150 ease-in"
          >
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span>Cart</span>
          </div>
        </div>
      </nav>

      <!-- hero banner -->
      <div class="h-80 flex items-end justify-between gap-4 mt-12 p-3">
        <!-- hero title -->
        <div class="pl-4 pr-4 w-1/2">
          <h1 class="font-semibold text-7xl uppercase">
            <span>Always</span>
            <span class="text-[#E95A08]"> Fresh Flowers </span>
          </h1>
          <span class="">
            <p class="text-lg font-light mt-4 flex">
              Indulge your senses with the beauty and fragrance of our fresh
              flower shop. From classic roses to exotic blooms, we offer a wide
              variety of fresh flowers that are perfect for any occasion.
            </p>
          </span>
        </div>
        <!-- hero image -->
        <div>
          <img src="image/hero-flower.png" alt="" />
        </div>
      </div>
    </header>

    <!-- Main -->

    <!-- Footer -->
  </body>
</html>
